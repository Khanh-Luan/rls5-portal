# Cấu hình FXServer cho FiveM GTA V Roleplay
# Nếu dùng txAdmin recipe (CFX Default / Qbox / QBCore), bạn có thể chỉ cần copy
# thư mục resources/[local]/rp-core sang và thêm dòng: ensure rp-core

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Bật OneSync (hỗ trợ miễn phí tối đa 48 người chơi)
set onesync on
sv_maxclients 48

sv_hostname "RLS5 | Royal Los Santos 5 Roleplay (Dev Test)"
sets sv_projectName "RLS5 - Royal Los Santos 5"
sets sv_projectDesc "Royal Los Santos 5 Roleplay - May chu nhap vai GTA V"
sets locale "vi-VN"
load_server_icon server-icon.png

# Lấy license key miễn phí tại Cfx.re Portal (https://portal.cfx.re/)
sv_licenseKey "CHANGE_ME_FROM_CFX_PORTAL"

# Các resource mặc định của CFX (cần có trong server-data nếu chạy không qua recipe)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# Resource Roleplay tự phát triển
ensure rp-core

# Quyền Admin cơ bản qua txAdmin hoặc ACE
add_ace group.admin command allow
add_ace group.admin command.quit deny
